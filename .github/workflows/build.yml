name: Build MAUI Projects

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        # dotnet-quality: 'preview' # Uncomment if .NET 10 is still in preview

    - name: Install MAUI Workload
      run: dotnet workload install maui-ios

    - name: Restore dependencies
      run: dotnet restore Maui.Bluetooth.ExternalAccessory.slnx

    - name: Build Maui10ExternalAccessoryRepro
      run: dotnet build Maui10ExternalAccessoryRepro/Maui10ExternalAccessoryRepro.csproj -c Release -f net10.0-ios

    - name: Build Maui10NoSceneDelegateExternalAccessoryRepro
      run: dotnet build Maui10NoSceneDelegateExternalAccessoryRepro/Maui10NoSceneDelegateExternalAccessoryRepro.csproj -c Release -f net10.0-ios
